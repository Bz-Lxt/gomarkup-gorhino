syntax = "proto3";

package gorhino.control.v1;

option go_package = "gorhino/internal/proto;proto";

service Control {
  rpc Connect(stream WorkerMsg) returns (stream MasterMsg);
}

message WorkerMsg {
  oneof body {
    Register register = 1;
    Heartbeat heartbeat = 2;
    StatsReport stats = 3;
    TaskAck ack = 4;
  }
}

message MasterMsg {
  oneof body {
    Welcome welcome = 1;
    StartTask start = 2;
    StopTask stop = 3;
  }
}

message Register {
  string node_id = 1;
  string hostname = 2;
  int32 cpu_count = 3;
}

message Heartbeat {
  string node_id = 1;
  int64 unix_ms = 2;
}

message StatsReport {
  string task_id = 1;
  int64 seq = 2;
  bytes histogram = 3;
  int64 requests = 4;
  int64 errors = 5;
  int64 bytes_out = 6;
  map<int32, int64> status_codes = 7;
  int64 timeout_count = 8;
  int64 other_count = 9;
  int64 sum_latency_us = 10;
}

message TaskAck {
  string task_id = 1;
  string action = 2;
  string error = 3;
}

message Welcome {
  string master_id = 1;
}

message StartTask {
  string task_id = 1;
  string method = 2;
  string url = 3;
  map<string, string> headers = 4;
  bytes body = 5;
  int32 vu = 6;
  int32 duration_sec = 7;
  int32 qps = 8;
}

message StopTask {
  string task_id = 1;
}
